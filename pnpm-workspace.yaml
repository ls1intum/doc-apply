nodeLinker: hoisted
preferFrozenLockfile: true
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# PrimeNG 22 is no longer MIT licensed, so we stay on PrimeNG 21 until it is replaced by the TUM AET UI kit.
peerDependencyRules:
  allowedVersions:
    primeng>@angular/cdk: '22'
    primeng>@angular/common: '22'
    primeng>@angular/core: '22'
    primeng>@angular/forms: '22'
    primeng>@angular/platform-browser: '22'
    primeng>@angular/router: '22'
overrides:
  braces: 3.0.3
  cookie: 1.1.1
  debug: 4.4.3
  esbuild: 0.28.1
  express: 5.1.0
  lodash: 4.18.0
  lodash-es: 4.18.0
  minimatch: 10.2.4
  picomatch: 4.0.4
  postcss: 8.5.26
  qs: 6.15.2
  rimraf: 6.1.3
  semver: 7.7.4
  tough-cookie: 6.0.1
  undici: 7.24.6
  webpack: 5.105.4
  webpack-dev-middleware: 7.4.5
  webpack-dev-server: 5.2.2
  word-wrap: 1.2.5
  ws: 8.18.3
  yargs-parser: 22.0.0
