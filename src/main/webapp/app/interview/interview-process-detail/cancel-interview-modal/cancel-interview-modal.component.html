<jhi-dialog
  header="interview.slots.cancelInterview.header"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [showHeader]="false"
  widthClass="w-[90vw] md:w-140"
>
  <div class="flex flex-col gap-6 pt-4">
    <jhi-dialog-icon-header [icon]="faCalendarXmark" titleKey="interview.slots.cancelInterview.header" />

    <p class="m-0 text-sm text-text-secondary" jhiTranslate="interview.slots.cancelInterview.message"></p>

    <div class="flex flex-col gap-3">
      <jhi-option-row
        [(checked)]="deleteSlot"
        titleKey="interview.slots.cancelInterview.deleteSlot"
        descriptionKey="interview.slots.cancelInterview.deleteSlotDescription"
      />
      <jhi-option-row
        [(checked)]="sendReinvite"
        titleKey="interview.slots.cancelInterview.sendReinvite"
        descriptionKey="interview.slots.cancelInterview.sendReinviteDescription"
      />
    </div>

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <jhi-button severity="secondary" variant="outlined" label="interview.slots.cancelInterview.keep" (click)="close()" />
      <jhi-button severity="danger" label="interview.slots.cancelInterview.triggerButton" (click)="onConfirm()" />
    </div>
  </div>
</jhi-dialog>
