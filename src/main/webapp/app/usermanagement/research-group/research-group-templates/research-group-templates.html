<div class="page-container flex flex-col">
  <div class="header-container">
    <div class="page-header">
      <h1>
        <span jhiTranslate="sidebar.researchgroup.title"></span>
        -
        <span jhiTranslate="researchGroup.emailTemplatesHeader"></span>
      </h1>
    </div>
    <jhi-button label="researchGroup.emailTemplates.newTemplate" icon="plus" [shouldTranslate]="true" (click)="navigateToCreate()" />
  </div>

  <div class="flex flex-col w-full self-center">
    <jhi-dynamic-table
      [columns]="columns()"
      [data]="tableData()"
      [rows]="pageSize()"
      (rowsHydrated)="pageSize.set($event)"
      [totalRecords]="total()"
      [page]="pageNumber()"
      (lazyLoad)="onTableEmit($event)"
    />

    <ng-template #actionsTemplate let-template>
      <div class="flex justify-end gap-1">
        @if (template.isCustom) {
          <jhi-button variant="text" icon="pen" tooltip="button.edit" (click)="navigateToEdit(template.emailTemplateId)" />
          @if (!isEmployee()) {
            <jhi-confirm-dialog
              label="button.delete"
              header="researchGroup.emailTemplates.deleteTemplateModal.title"
              message="researchGroup.emailTemplates.deleteTemplateModal.message"
              confirmIcon="trash"
              (confirmed)="delete(template.emailTemplateId)"
              severity="danger"
              tooltip="button.delete"
              [iconOnly]="true"
            />
          }
        } @else {
          <jhi-button variant="text" icon="eye" tooltip="button.view" (click)="navigateToView(template.emailType)" />
        }
      </div>
    </ng-template>
  </div>
</div>
