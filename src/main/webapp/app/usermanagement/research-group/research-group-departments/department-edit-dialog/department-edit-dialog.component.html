<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-4 py-4">
  <p class="m-0 text-xs text-text-secondary" jhiTranslate="global.input.requiredHint"></p>

  <div>
    <jhi-string-input
      [control]="form.controls.name"
      [model]="form.controls.name.value"
      [label]="translationKey + '.nameLabel'"
      [placeholder]="translationKey + '.namePlaceholder'"
      [required]="true"
      [shouldTranslate]="true"
    />
  </div>

  <div>
    <jhi-select
      [label]="translationKey + '.schoolLabel'"
      [placeholder]="translationKey + '.schoolPlaceholder'"
      [items]="schoolOptions()"
      [required]="true"
      [selected]="selectedSchoolOption()"
      (selectedChange)="onSchoolChange($event)"
    />
  </div>

  <div class="flex justify-end gap-4 mt-8 pt-4 border-t border-border-default">
    <jhi-button
      [label]="'button.cancel'"
      severity="secondary"
      variant="outlined"
      (click)="onCancel()"
      [disabled]="isSubmitting()"
      [shouldTranslate]="true"
    />
    <jhi-button
      [label]="isEditMode() ? 'button.save' : translationKey + '.createButton'"
      severity="primary"
      type="submit"
      [loading]="isSubmitting()"
      [disabled]="formInvalid() || isSubmitting()"
      [shouldTranslate]="true"
    />
  </div>
</form>
