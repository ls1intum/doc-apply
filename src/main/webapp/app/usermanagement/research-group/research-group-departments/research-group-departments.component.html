<div class="page-container">
  <div class="header-container">
    <div class="page-header">
      <h1 jhiTranslate="researchGroup.departments.header">Departments</h1>
    </div>
    <div class="flex items-center gap-2">
      <jhi-button
        label="researchGroup.departments.createButton"
        icon="plus"
        severity="primary"
        (click)="onCreateDepartment()"
        [shouldTranslate]="true"
      />
    </div>
  </div>
  <jhi-search-filter-sort-bar
    [searchText]="'researchGroup.departments.searchPlaceholder'"
    [totalRecords]="total()"
    [singleEntity]="'researchGroup.departments.entity'"
    [multipleEntities]="'researchGroup.departments.entities'"
    [filters]="filters()"
    (searchOutput)="onSearchEmit($event)"
    (filterOutput)="onFilterEmit($event)"
    (sortOutput)="loadOnSortEmit($event)"
    [sortableFields]="sortableFields"
  />

  <div>
    <jhi-dynamic-table
      [columns]="columns()"
      [data]="tableData()"
      [totalRecords]="total()"
      [page]="pageNumber()"
      [rows]="pageSize()"
      [selectable]="false"
      (lazyLoad)="loadOnTableEmit($event)"
    />
  </div>

  <ng-template #actionTemplate let-department>
    <div class="flex gap-2 justify-end items-center">
      <jhi-button
        icon="pencil"
        ariaLabel="button.edit"
        tooltip="button.edit"
        severity="primary"
        variant="text"
        [shouldTranslate]="true"
        (click)="onEditDepartment(department.departmentId)"
      />
      <jhi-confirm-dialog
        #deleteDialog
        header="researchGroup.departments.deleteDialog.header"
        message="researchGroup.departments.deleteDialog.message"
        confirmIcon="trash"
        (confirmed)="onDeleteDepartment(department.departmentId)"
        severity="danger"
        label="button.delete"
        [showOpenButton]="false"
      />
      <jhi-button
        severity="primary"
        variant="text"
        icon="ellipsis-vertical"
        [shouldTranslate]="true"
        (click)="onMenuToggle($event, menu, department, deleteDialog)"
      />
      <jhi-menu #menu [items]="menuItems()" [shouldTranslate]="true" />
    </div>
  </ng-template>
</div>
