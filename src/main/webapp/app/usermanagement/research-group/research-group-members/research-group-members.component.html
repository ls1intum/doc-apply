<div class="page-container">
  <div class="header-container">
    <div class="page-header">
      <div class="flex items-center gap-2">
        @if (researchGroupId()) {
          <jhi-back-button />
          <h1>
            <span jhiTranslate="researchGroup.memberHeaderAdmin"></span>
            @if (researchGroupName()) {
              <span> - {{ researchGroupName() }}</span>
            }
          </h1>
        } @else {
          <h1>
            <span jhiTranslate="sidebar.researchgroup.title"></span>
            -
            <span jhiTranslate="researchGroup.memberHeader"></span>
          </h1>
        }
      </div>
    </div>
    @if (!isEmployee()) {
      <jhi-button
        [label]="'researchGroup.members.addMembers'"
        icon="user-plus"
        [shouldTranslate]="true"
        severity="primary"
        (click)="openAddMembersModal()"
      />
    }
  </div>

  <!-- Members Table -->
  <div>
    <jhi-dynamic-table
      [columns]="columns()"
      [data]="tableData()"
      [totalRecords]="total()"
      [page]="pageNumber()"
      [rows]="pageSize()"
      (rowsHydrated)="pageSize.set($event)"
      [selectable]="false"
      (lazyLoad)="loadOnTableEmit($event)"
    />
  </div>

  <!-- Templates for dynamic table -->
  <ng-template #nameTemplate let-member>
    <div class="flex items-center gap-2">
      <jhi-user-avatar [fullName]="member.name" [avatarUrl]="member.avatar" loading="lazy" />
      <span>
        {{ member.name }}
        @if (member.isCurrentUser) {
          ({{ 'researchGroup.members.you' | translate }})
        }
      </span>
    </div>
  </ng-template>

  <ng-template #roleTemplate let-member>
    <span>{{ member.role }}</span>
  </ng-template>

  <ng-template #deleteTemplate let-member>
    @if (member.canRemove) {
      <jhi-confirm-dialog
        label="button.remove"
        header="researchGroup.members.removeMemberModal.title"
        message="researchGroup.members.removeMemberModal.message"
        confirmIcon="trash"
        (confirmed)="removeMember(member)"
        severity="danger"
        tooltip="button.remove"
        [iconOnly]="true"
      />
    }
  </ng-template>
</div>
