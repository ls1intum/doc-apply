<div
  class="flex max-h-[90dvh] max-w-[90dvw] flex-col overflow-hidden rounded-xl border border-border-default bg-background-default text-text-primary shadow-xl"
  [class]="panelClass"
  [style]="panelStyle"
>
  @if (showHeader) {
    <div class="flex shrink-0 items-center justify-between gap-2 p-4">
      <h2 [id]="config.titleId" class="text-xl font-semibold">{{ config.options.header }}</h2>
      @if (closable) {
        <button
          type="button"
          class="inline-flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent text-text-secondary transition-colors hover:bg-background-surface"
          [attr.aria-label]="closeLabel()"
          (click)="close()"
        >
          <fa-icon [icon]="faXmark" />
        </button>
      }
    </div>
  }
  <div #content class="grow overflow-y-auto px-4 pb-4" [class.pt-4]="!showHeader" [style]="contentStyle">
    <ng-container [ngComponentOutlet]="config.component" [ngComponentOutletInjector]="config.contentInjector" />
  </div>
</div>
