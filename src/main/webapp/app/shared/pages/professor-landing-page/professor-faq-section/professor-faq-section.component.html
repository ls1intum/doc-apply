<div class="flex flex-col items-center justify-center gap-5 self-stretch py-12 px-3 sm:py-24 sm:px-12">
  <h2 class="text-[2rem] font-bold" jhiTranslate="professorLandingPage.faq.headline"></h2>
  <p class="text-xl font-semibold" jhiTranslate="professorLandingPage.faq.subheadline"></p>
  <div class="flex items-center gap-2">
    <a href="https://ls1intum.github.io/doc-apply" target="_blank">
      <span jhiTranslate="professorLandingPage.faq.sub-subheadline"></span>
      <fa-icon [icon]="faArrowUpRightFromSquare" class="external-icon" size="xs" />
    </a>
  </div>
  <jhi-accordion class="w-full max-w-3xl" [items]="visibleTabs()">
    <ng-template #footer let-tab>
      <div class="flex justify-center mt-4">
        @if (tab.value === 'registration') {
          <jhi-button (click)="openRegistrationForm()" [shouldTranslate]="true" [label]="translationKey + '.registration.button'" />
        }
      </div>
    </ng-template>
  </jhi-accordion>
</div>
