<jhi-dialog
  widthClass="w-150"
  [visible]="visible()"
  header="settings.aiFeatures.modal.header"
  [showHeader]="false"
  (visibleChange)="visibleChange.emit($event)"
>
  <div class="flex flex-col gap-6 pt-4">
    <jhi-dialog-icon-header [icon]="faRobot" titleKey="settings.aiFeatures.modal.header" [closable]="true" (closed)="close()" />

    <jhi-icon-intro [icon]="faWandMagicSparkles" titleKey="settings.aiFeatures.modal.title">
      <p class="m-0 text-text-secondary" jhiTranslate="settings.aiFeatures.modal.intro"></p>
    </jhi-icon-intro>

    <jhi-icon-feature-list [items]="points()" />
  </div>
</jhi-dialog>
