<jhi-dialog
  widthClass="w-[90vw] md:w-168"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  header="genderDecoder.resultTitle"
  [showHeader]="false"
  [dismissableMask]="false"
>
  <div class="flex flex-col gap-6 pt-4">
    <jhi-dialog-icon-header [icon]="faVenusMars" titleKey="genderDecoder.resultTitle" [closable]="true" (closed)="onVisibleChange(false)" />

    <jhi-icon-intro [icon]="codingIcon()" titleKey="genderDecoder.resultHeading">
      <jhi-tag [text]="codingTranslationKey()" [color]="codingTagColor()" />
      <p class="m-0 text-text-secondary" [jhiTranslate]="explanationTranslationKey()"></p>
    </jhi-icon-intro>

    @if (result().length > 0) {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        @for (panel of wordPanels(); track panel.labelKey) {
          <section class="flex flex-col gap-3 rounded-lg border border-border-default p-4">
            <div class="flex items-center gap-3">
              <span
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-border-default text-sm"
                [class]="panel.iconClass"
                aria-hidden="true"
              >
                <fa-icon [icon]="panel.icon" />
              </span>
              <h4 class="m-0 text-sm font-semibold text-text-primary">
                <span [jhiTranslate]="panel.labelKey"></span>
                <span class="ms-1 text-text-secondary">({{ panel.total }})</span>
              </h4>
            </div>
            <ul class="m-0 flex list-none flex-wrap gap-2 p-0">
              @for (entry of panel.words; track entry.word) {
                <li class="rounded-full border border-border-default px-2.5 py-0.5 text-sm text-text-primary">
                  {{ entry.word }}
                  @if (entry.count > 1) {
                    <span class="text-text-secondary">×{{ entry.count }}</span>
                  }
                </li>
              } @empty {
                <li class="text-sm italic text-text-tertiary" jhiTranslate="genderDecoder.noWordsFound"></li>
              }
            </ul>
          </section>
        }
      </div>
    }

    <p class="m-0 text-xs text-text-secondary [&_a]:text-primary-default [&_a]:underline" jhiTranslate="genderDecoder.originalDecoder"></p>
  </div>
</jhi-dialog>
