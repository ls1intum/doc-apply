<div class="relative">
  <button
    #nativeButton
    tumAetUiButton
    [severity]="severity()"
    [variant]="kitVariant()"
    [size]="kitSize()"
    [class]="buttonClass()"
    [type]="type()"
    [disabled]="isDisabled()"
    [attr.aria-label]="resolvedAriaLabel()"
    [attr.aria-busy]="loading() ? true : undefined"
    [tumAetUiTooltip]="displayTooltip() ?? ''"
    [tumAetUiTooltipPlacement]="tooltipPosition()"
    [tumAetUiTooltipDescribesHost]="tooltipDescribesHost()"
    [showDelayMs]="tooltipShowDelay()"
    [hideDelayMs]="tooltipHideDelay()"
  >
    @if (loading()) {
      <fa-icon class="animate-spin motion-reduce:animate-none" [icon]="faSpinner" aria-hidden="true" />
    } @else if (icon() !== undefined) {
      <fa-icon [icon]="[iconPrefix(), icon() ?? '']" />
    }
    @if (label() !== undefined) {
      <span>{{ displayLabel() }}</span>
    }
    @if (isExternalLink()) {
      <fa-icon class="external-icon" size="xs" [icon]="faArrowUpRightFromSquare" aria-hidden="true" />
    }
  </button>
  @if (numberOfFavorites()) {
    <span
      class="favorites-badge pointer-events-none absolute -top-2 -right-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-primary-default px-1 text-xs font-bold text-text-on-primary"
    >
      {{ numberOfFavorites() }}
    </span>
  }
</div>
