<div class="flex flex-col gap-4 items-center">
  <div class="flex flex-col gap-2 text-center">
    <span class="text-center whitespace-pre-line" jhiTranslate="auth.common.otp.instructions"></span>
    <span [translateValues]="{ minutes: ttlMinutes }" jhiTranslate="auth.common.otp.minutes"></span>
  </div>
  <div class="flex justify-center gap-2" role="group">
    @for (slot of slots(); track slot.index) {
      <input
        #otpSlot
        type="text"
        tumAetUiInput
        [tumAetUiInputSize]="otpSize()"
        [class]="slotClass()"
        [value]="slot.character"
        [attr.aria-label]="slot.label"
        [attr.autocomplete]="slot.index === 0 ? 'one-time-code' : 'off'"
        autocapitalize="characters"
        inputmode="text"
        spellcheck="false"
        (input)="onSlotInput($event, slot.index)"
        (keydown)="onSlotKeyDown($event, slot.index)"
        (paste)="onSlotPaste($event, slot.index)"
        (focus)="selectSlot(slot.index)"
      />
    }
  </div>
  <div class="text-negative-default">
    @if (isAttemptCooldown()) {
      <span [translateValues]="{ seconds: attemptCooldownSeconds() }" jhiTranslate="auth.common.otp.attemptCooldown"></span>
    } @else if (showError()) {
      <span jhiTranslate="auth.common.otp.error"></span>
    }
  </div>
  <div class="flex justify-between w-full gap-8">
    <jhi-button
      (click)="onResend()"
      [disabled]="disableResend()"
      [fullWidth]="true"
      [label]="resendLabelKey()"
      [shouldTranslate]="true"
      [translationParams]="resendLabelParams()"
      variant="text"
    />
    <jhi-button
      (click)="onSubmit()"
      [disabled]="disabledSubmit()"
      [fullWidth]="true"
      [loading]="isBusy()"
      [shouldTranslate]="true"
      label="auth.common.otp.submit"
    />
  </div>
</div>
