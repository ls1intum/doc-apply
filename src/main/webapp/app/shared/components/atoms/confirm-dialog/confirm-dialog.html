<tumaet-ui-dialog
  [visible]="isOpen()"
  (visibleChange)="onVisibleChange($event)"
  [header]="displayHeader()"
  [ariaLabel]="ariaLabel()"
  [closable]="false"
  [dismissableMask]="true"
  [size]="dialogSize()"
  [role]="'alertdialog'"
  [ariaDescribedBy]="messageId"
>
  <p [id]="messageId" class="max-w-[40rem] text-left">{{ displayMessage() }}</p>
  <ng-template #footer>
    <jhi-button [shouldTranslate]="true" label="entity.action.cancel" (click)="reject()" variant="outlined" [size]="size()" />
    <jhi-button
      [label]="confirmLabel()"
      [icon]="confirmIcon()"
      (click)="accept()"
      [severity]="severity()"
      [variant]="variant()"
      [disabled]="disabled()"
      [size]="size()"
    />
  </ng-template>
</tumaet-ui-dialog>

@if (showOpenButton()) {
  <jhi-button
    [label]="iconOnly() ? undefined : label()"
    [icon]="confirmIcon()"
    (click)="confirm()"
    [severity]="severity()"
    [variant]="iconOnly() ? 'text' : variant()"
    [tooltip]="tooltip()"
    [tooltipPosition]="tooltipPosition()"
    [disabled]="disabled()"
    [size]="size()"
  />
}
