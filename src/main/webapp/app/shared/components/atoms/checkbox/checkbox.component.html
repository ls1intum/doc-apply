<div class="flex flex-col gap-1">
  <div class="flex items-center gap-1" [class.border-negative-default]="inputState() === 'invalid' && !isFocused()">
    <!-- A negative tab index makes the box inert, so neither focus nor clicks stop at it and the surrounding control gets them -->
    <span class="inline-flex" [attr.inert]="tabIndex() < 0 ? '' : undefined">
      @if (control()) {
        <tumaet-ui-checkbox
          [formControl]="formControl()"
          [inputId]="inputId()"
          (changed)="onCheckboxChange($event)"
          (focusin)="onFocus()"
          (focusout)="onBlur()"
        />
      } @else {
        <tumaet-ui-checkbox
          [checked]="model() ?? false"
          (changed)="modelChange.emit($event.checked)"
          [inputId]="inputId()"
          [disabled]="disabled()"
          (focusin)="onFocus()"
          (focusout)="onBlur()"
        />
      }
    </span>

    @if (label(); as label) {
      <label class="text-text-primary ml-1" [for]="inputId()">
        @if (shouldTranslate()) {
          <span [jhiTranslate]="label"></span>
        } @else {
          {{ label }}
        }
        @if (required()) {
          <span class="text-negative-default ml-0.5">*</span>
        }
      </label>
    }

    @if (tooltipText(); as tooltip) {
      <fa-icon class="icon" [icon]="['fas', 'circle-info']" [tumAetUiTooltip]="displayTooltipText()" tumAetUiTooltipPlacement="top" />
    } @else if (icon(); as icon) {
      <fa-icon class="icon" [icon]="['fas', icon]" />
    }
  </div>

  @if (errorEnabled()) {
    <div class="text-xs text-negative-default min-h-4">
      @if (inputState() === 'invalid' && !isFocused()) {
        {{ errorMessage() }}
      }
    </div>
  }
</div>
