<div class="flex items-center gap-2">
  @if (rating() !== undefined) {
    <div class="flex gap-0.5">
      @for (star of starStates(); track $index) {
        <fa-icon
          [icon]="star.half ? ['fas', 'star-half-stroke'] : ['fas', 'star']"
          [class]="sizeClass() + ' ' + (star.filled || star.half ? starColourClass() : emptyStarColourClass)"
        />
      }
    </div>
    @if (showValue()) {
      <span [class]="'text-text-primary ' + sizeClass()">{{ formattedRating() }}</span>
    }
  } @else {
    <span class="text-sm text-text-disabled italic" jhiTranslate="evaluation.noRatingsYet"></span>
  }
</div>
