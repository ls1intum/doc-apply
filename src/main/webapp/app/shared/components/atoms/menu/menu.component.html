<ng-template #menuTemplate>
  <tumaet-ui-menu>
    @for (entry of entries(); track $index) {
      <button
        type="button"
        tumAetUiMenuItem
        [class]="entry.itemClass"
        [disabled]="entry.item.disabled === true"
        (triggered)="choose(entry.item)"
      >
        @if (entry.item.icon) {
          <fa-icon class="w-4 shrink-0 text-center" [class]="entry.iconClass" [icon]="entry.item.icon" />
        }
        @if (shouldTranslate()) {
          <span [jhiTranslate]="entry.item.label"></span>
        } @else {
          <span>{{ entry.item.label }}</span>
        }
      </button>
    }
  </tumaet-ui-menu>
</ng-template>
