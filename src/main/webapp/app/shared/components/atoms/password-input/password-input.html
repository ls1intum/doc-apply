<div>
  <div class="label-top label-input-wrapper">
    @let labelValue = label();
    @if (labelValue) {
      <label class="custom-label" [for]="inputId()">
        {{ displayLabel() }}
        @if (required()) {
          <span class="required">*</span>
        }
        @if (icon()) {
          @if (icon() === 'circle-info' && tooltipText()) {
            <fa-icon class="icon" [icon]="['fas', icon() ?? '']" [tumAetUiTooltip]="displayTooltipText()" tumAetUiTooltipPlacement="top" />
          } @else {
            <fa-icon class="icon" [icon]="['fas', icon() ?? '']" />
          }
        }
      </label>
    }

    <div class="input-wrapper relative" [style.width]="width()">
      <input
        (blur)="onBlur()"
        (focus)="onFocus()"
        (ngModelChange)="onInputChange($event)"
        [disabled]="disabled()"
        [ngModel]="model()"
        [placeholder]="displayPlaceholder()"
        [required]="required()"
        [tumAetUiInputId]="inputId()"
        [tumAetUiInputInvalid]="inputState() === 'invalid'"
        [type]="inputType()"
        autocomplete="off"
        class="w-full pe-10"
        tumAetUiInput
      />
      <button
        type="button"
        class="btn-bare absolute inset-y-0 end-0 flex w-10 items-center justify-center rounded-e-md text-text-secondary hover:text-text-primary disabled:cursor-default disabled:text-text-disabled"
        [attr.aria-label]="toggleLabel()"
        [attr.aria-controls]="inputId()"
        [attr.aria-pressed]="passwordVisible()"
        [disabled]="disabled()"
        (mousedown)="$event.preventDefault()"
        (click)="togglePasswordVisibility()"
      >
        <fa-icon [icon]="['fas', toggleIcon()]" />
      </button>

      @if (showStrength() && isFocused()) {
        <div
          class="absolute start-0 top-full z-10 mt-1 w-full rounded-md border border-border-default bg-background-surface p-3 shadow-md"
          aria-live="polite"
        >
          <div class="h-2 w-full overflow-hidden rounded-sm bg-background-surface-alt">
            <div class="h-full transition-all duration-200" [class]="strengthBarClass()"></div>
          </div>
          <div class="mt-2 text-sm text-text-secondary" [jhiTranslate]="strengthLabelKey()"></div>
        </div>
      }
    </div>

    @if (formControl()) {
      <input type="hidden" [formControl]="formControl()" />
    }
    <div class="error-text">
      @if (inputState() === 'invalid' && !isFocused()) {
        {{ errorMessage() }}
      }
    </div>
  </div>
</div>
