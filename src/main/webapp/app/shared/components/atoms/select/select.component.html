<div [class]="containerClasses()" [class.disabled]="disabled()" [style.--jhi-select-inline-width]="inlineWidth()">
  <div [class]="layoutClasses()">
    @if (label()) {
      <label class="custom-label" [class]="labelLayoutClasses()" [for]="inputId()"
        >{{ displayLabel() }}
        @if (required()) {
          <span class="required">*</span>
        }
        @if (icon()) {
          @if (icon() === 'circle-info' && tooltipText()) {
            <fa-icon
              class="icon text-primary-default"
              [icon]="['fas', icon() ?? '']"
              [tumAetUiTooltip]="displayTooltipText()"
              tumAetUiTooltipPlacement="top"
            />
          } @else {
            <fa-icon class="icon" [icon]="['fas', icon() ?? '']" />
          }
        }
      </label>
    }
    <tumaet-ui-select
      [options]="displayOptions()"
      optionLabel="label"
      optionValue="index"
      [ngModel]="selectedIndex()"
      [ngModelOptions]="{ standalone: true }"
      (selectionChange)="onKitSelectionChange($event)"
      [placeholder]="displayPlaceholder()"
      [disabled]="disabled()"
      [filter]="filter()"
      [showClear]="showClear()"
      [size]="size()"
      [inputId]="inputId()"
      [style.width]="selectWidth()"
      [class]="selectWidthClasses()"
    />
  </div>
  @if (errorEnabled()) {
    <div class="error-text"></div>
  }
</div>
