<div>
  <div class="label-top label-input-wrapper">
    @if (label()) {
      <label class="custom-label" [for]="inputId()">
        {{ displayLabel() }}
        @if (required()) {
          <span class="required">*</span>
        }
        @if (icon()) {
          @if (icon() === 'circle-info' && tooltipText()) {
            <fa-icon class="icon" [icon]="['fas', icon() ?? '']" [tumAetUiTooltip]="displayTooltipText()" tumAetUiTooltipPlacement="top" />
          } @else {
            <fa-icon class="icon" [icon]="['fas', icon() ?? '']" />
          }
        }
      </label>
    }

    <div class="input-wrapper">
      <tumaet-ui-input-number
        [inputId]="inputId()"
        [placeholder]="displayPlaceholder()"
        [disabled]="disabled()"
        [ngModel]="model()"
        (ngModelChange)="onInputChange($event)"
        (focusin)="onFocus()"
        (focusout)="onBlur()"
        [invalid]="inputState() === 'invalid'"
        [useGrouping]="false"
        [maxFractionDigits]="maxFractionDigits()"
        [style.width]="width()"
        [class]="hostClass()"
      />

      @if (formControl()) {
        <input type="hidden" [formControl]="formControl()" />
      }
    </div>
    <div class="error-text">
      @if (inputState() === 'invalid' && !isFocused()) {
        {{ errorMessage() }}
      }
    </div>
  </div>
</div>
