<button type="button" class="inline-flex text-primary-default" [attr.aria-label]="displayAriaLabel()" [tumAetUiPopoverTrigger]="popover">

</button>
<tumaet-ui-popover #popover [ariaLabel]="displayAriaLabel()">

</tumaet-ui-popover>
