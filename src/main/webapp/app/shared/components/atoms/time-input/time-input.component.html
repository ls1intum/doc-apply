<input
  type="text"
  tumAetUiInput
  tumAetUiInputSize="small"
  inputmode="numeric"
  autocomplete="off"
  maxlength="5"
  placeholder="--:--"
  [tumAetUiInputId]="inputId()"
  [value]="displayValue()"
  [disabled]="disabled()"
  [class]="'w-17 h-8 text-center font-normal ' + classStyling()"
  (input)="onInput($event)"
/>
