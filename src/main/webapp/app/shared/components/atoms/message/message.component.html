@if (variant() === 'simple') {
  <div [class]="simpleClass()" [attr.role]="severity() === 'error' ? 'alert' : 'status'">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
} @else {
  <tumaet-ui-message [severity]="severity()" [class]="classStyling()" [style.font-size]="fontSize()">
    <ng-container [ngTemplateOutlet]="content" />
  </tumaet-ui-message>
}

<ng-template #content>
  @if (message()) {
    <p [innerHTML]="displayMessage()"></p>
  } @else {
    <ng-content />
  }
</ng-template>
