<span
  class="inline-flex items-center justify-center gap-1 rounded-full border px-2 py-1 text-center text-xs leading-[1.125rem] font-bold"
  [class]="tagClass()"
  [style.width]="width()"
  [tumAetUiTooltip]="displayTooltipText()"
>
  @if (icon(); as iconValue) {
    @if (!iconRight()) {
      <fa-icon [icon]="iconValue" class="icon" />
    }
  }

  <span>{{ displayText() }}</span>

  @if (icon(); as iconValue) {
    @if (iconRight()) {
      <fa-icon [icon]="iconValue" class="icon" />
    }
  }
</span>
