<tumaet-ui-tag
  [class]="tagClass()"
  [severity]="severity()"
  [rounded]="round()"
  [tumAetUiTooltip]="displayTooltipText()"
  [style.width]="width()"
>
  @if (icon(); as iconValue) {
    @if (!iconRight()) {
      <fa-icon [icon]="iconValue" class="icon" />
    }
  }

  <span>{{ displayText() }}</span>

  @if (icon(); as iconValue) {
    @if (iconRight()) {
      <fa-icon [icon]="iconValue" class="icon" />
    }
  }
</tumaet-ui-tag>
