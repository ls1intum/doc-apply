@if (selectable()) {
  <div
    class="inline-flex flex-wrap items-center gap-1 rounded-lg bg-background-surface p-1"
    role="radiogroup"
    [attr.aria-label]="groupLabel()"
  >
    @for (segment of segments(); track segment.value) {
      <button
        #segmentButton
        type="button"
        role="radio"
        [class]="segment.buttonClass"
        [attr.aria-checked]="segment.selected"
        [attr.tabindex]="segment.tabbable ? 0 : -1"
        (click)="onSelect(segment.value)"
        (keydown)="onKeydown($event)"
      >
        <span class="size-2 shrink-0 rounded-full" [class]="segment.dotClass" aria-hidden="true"></span>
        <span [jhiTranslate]="segment.labelKey"></span>
      </button>
    }
  </div>
} @else {
  @if (selectedOption(); as option) {
    <span
      class="inline-flex items-center gap-1.5 rounded-full border border-border-default px-2 py-0.5 text-xs font-medium text-text-primary"
    >
      <span class="size-2 shrink-0 rounded-full" [class]="option.dotClass" aria-hidden="true"></span>
      <span [jhiTranslate]="option.labelKey"></span>
    </span>
  } @else {
    <span class="text-xs text-text-tertiary" jhiTranslate="evaluation.ratings.notRated"></span>
  }
}
