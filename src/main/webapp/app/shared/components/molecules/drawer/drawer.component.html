<ng-template #panel>
  <div
    class="flex flex-col bg-background-default text-text-primary shadow-xl"
    [class]="panelClasses()"
    role="dialog"
    [attr.aria-modal]="modal()"
    [attr.aria-labelledby]="headerId"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <div class="flex shrink-0 items-center justify-between gap-2 p-5">
      <div [id]="headerId" class="flex min-w-0 flex-1 items-center">
        <ng-content select="[drawer-header]" />
      </div>
      @if (showCloseIcon()) {
        <button
          type="button"
          class="inline-flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent text-text-secondary transition-colors hover:bg-background-surface"
          [attr.aria-label]="closeLabel()"
          (click)="close()"
        >
          <fa-icon [icon]="faXmark" />
        </button>
      }
    </div>
    <div class="min-h-0 grow overflow-y-auto px-5 pb-5">
      <ng-content />
    </div>
  </div>
</ng-template>
