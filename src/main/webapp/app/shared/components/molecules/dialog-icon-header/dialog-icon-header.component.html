<div class="flex items-center gap-3 text-text-primary">
  <fa-icon [icon]="icon()" class="text-xl text-primary-default" aria-hidden="true" />
  <h2 class="m-0 flex-1 text-xl font-semibold" [jhiTranslate]="titleKey()" [translateValues]="titleValues()"></h2>
  @if (closable()) {
    <button
      type="button"
      class="inline-flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-md text-text-secondary transition-colors hover:bg-background-surface hover:text-text-primary"
      [attr.aria-label]="'button.close' | translate"
      (click)="closed.emit()"
    >
      <fa-icon [icon]="faXmark" aria-hidden="true" />
    </button>
  }
</div>
