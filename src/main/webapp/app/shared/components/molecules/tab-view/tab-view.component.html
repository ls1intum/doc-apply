<tumaet-ui-tabs [class]="resolvedTabsClass()" [value]="currentTabValue()" (valueChange)="onTabChange($event)">
  <tumaet-ui-tab-list [class]="tabListClass()">
    @for (tab of tabs(); track tab.id) {
      <tumaet-ui-tab [value]="tab.id" [class]="tabClass()">
        @if (tab.icon) {
          <fa-icon [icon]="tab.icon" class="mr-1" />
        }
        <span [jhiTranslate]="tab.translationKey"></span>
      </tumaet-ui-tab>
    }
  </tumaet-ui-tab-list>

  <tumaet-ui-tab-panels class="block pt-3.5" [class]="tabPanelsClass()">
    @for (panel of panels(); track panel.id) {
      <tumaet-ui-tab-panel [value]="panel.id">
        <div [class]="tabPanelClass()">
          @if (panel.template) {
            <ng-container *ngTemplateOutlet="panel.template" />
          }
        </div>
      </tumaet-ui-tab-panel>
    }
  </tumaet-ui-tab-panels>
</tumaet-ui-tabs>
