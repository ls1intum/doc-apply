<jhi-dialog
  widthClass="w-180"
  [visible]="visible()"
  (visibleChange)="close()"
  [showHeader]="false"
  [dismissableMask]="false"
  [closeOnEscape]="false"
  [closable]="false"
>
  <div class="flex flex-col gap-6 pt-4">
    <div class="flex items-center gap-3 text-text-primary">
      <fa-icon [icon]="faShieldHalved" class="text-xl text-primary-default" aria-hidden="true" />
      <h2 class="m-0 text-xl font-semibold" [jhiTranslate]="promptHeaderKey()"></h2>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-lg bg-primary-default/15 text-primary-default">
        <fa-icon [icon]="faFingerprint" class="text-3xl" aria-hidden="true" />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <h3 class="m-0 text-xl font-semibold leading-tight text-text-primary sm:text-2xl" [jhiTranslate]="promptTitleKey()"></h3>
        @if (keycloakAuthenticationService.isTumRealmSession()) {
          <p class="m-0 text-text-secondary" jhiTranslate="auth.passkey.prompt.tum.description"></p>
          <div class="flex flex-wrap gap-2">
            @for (tagKey of tumTagKeys; track tagKey) {
              <span
                class="rounded-full border border-primary-default/35 bg-primary-default/10 px-2 py-0.5 text-xs font-semibold text-primary-default"
                [jhiTranslate]="tagKey"
              ></span>
            }
          </div>
        }
      </div>
    </div>

    <ul class="m-0 flex list-none flex-col gap-4 rounded-lg border border-border-default p-4">
      @for (benefit of benefits; track benefit.labelKey) {
        <li class="flex items-center gap-3">
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-border-default text-sm text-primary-default"
            aria-hidden="true"
          >
            <fa-icon [icon]="benefit.icon" />
          </span>
          <p class="m-0 text-sm">
            <span class="me-1 font-semibold text-text-primary" [jhiTranslate]="benefit.labelKey"></span>
            <span class="text-text-secondary" [jhiTranslate]="benefit.descriptionKey"></span>
          </p>
        </li>
      }
    </ul>

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
      <jhi-button
        [shouldTranslate]="true"
        severity="secondary"
        variant="outlined"
        label="auth.passkey.prompt.dontAskAgain"
        (click)="dontAskAgain()"
      />
      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center">
        <jhi-button [shouldTranslate]="true" severity="secondary" variant="outlined" label="auth.passkey.prompt.later" (click)="close()" />
        <jhi-button
          [shouldTranslate]="true"
          [loading]="busy()"
          [disabled]="busy()"
          severity="primary"
          icon="key"
          label="auth.passkey.prompt.register"
          (click)="registerPasskey()"
        />
      </div>
    </div>
  </div>
</jhi-dialog>
