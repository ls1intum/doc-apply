<jhi-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="application()?.applicationDetailDTO?.applicant?.user?.name ?? ''"
  [shouldTranslateHeader]="false"
  width="56%"
  maxWidth="42rem"
  [contentStyle]="mode() === 'REJECT' ? { overflow: 'visible' } : {}"
>
  <div class="flex items-center gap-2 mb-4 text-text-disabled">
    <fa-icon class="text-primary" [icon]="['fas', 'briefcase']" />
    <span>{{ application()?.applicationDetailDTO?.jobTitle ?? '' }}</span>
  </div>

  @if (mode() === 'ACCEPT') {
    <!-- TODO: Removed until editor is fixed -->
    <!--
    <jhi-editor
      label="evaluation.message"
      placeholder="evaluation.writeMessage"
      [model]="editorModel()"
      (modelChange)="editorModel.set($event)"
      [required]="true"
    />
    -->
    <div class="flex flex-col gap-4">
      <jhi-checkbox
        [model]="notifyApplicant()"
        (modelChange)="notifyApplicant.set($event)"
        [errorEnabled]="false"
        [shouldTranslate]="true"
        label="evaluation.notifyApplicant"
        id="notifyApplicantCb"
      />
      <jhi-checkbox
        [model]="closeJob()"
        (modelChange)="closeJob.set($event)"
        [errorEnabled]="false"
        [shouldTranslate]="true"
        label="evaluation.closeJobAndRejectAll"
        id="closeJobCb"
      />
    </div>
  } @else {
    <jhi-select
      [items]="rejectReasons"
      label="evaluation.reason"
      [required]="true"
      [selected]="selectedRejectReason()"
      placeholder="evaluation.selectReason"
      [translateItems]="true"
      (selectedChange)="onSelectChange($event)"
    />
    <jhi-checkbox
      [model]="notifyApplicant()"
      (modelChange)="notifyApplicant.set($event)"
      [errorEnabled]="false"
      [shouldTranslate]="true"
      label="evaluation.notifyApplicant"
      id="notifyApplicantCb2"
      class="block mt-2"
    />
  }

  <div class="flex justify-end gap-2 pt-6">
    <jhi-button label="button.cancel" variant="outlined" (click)="visible.set(false)" />
    @if (mode() === 'ACCEPT') {
      <jhi-button label="evaluation.accept" severity="success" [disabled]="!canAccept()" (click)="onAccept()" />
    } @else {
      <jhi-button label="evaluation.reject" severity="danger" [disabled]="!canReject()" (click)="onReject()" />
    }
  </div>
</jhi-dialog>
