<div
  class="flex gap-4 {{ data().fullWidth ? 'items-stretch flex-auto self-stretch' : 'items-center max-w-fit' }} {{
    data().direction === 'vertical' ? 'flex-col' : 'flex-row'
  }}"
>
  @for (button of data().buttons; track $index) {
    <jhi-button
      class="grow-1"
      buttonClass="w-full"
      [severity]="button.severity"
      [variant]="button.variant"
      [icon]="button.icon"
      [isExternalLink]="button.isExternalLink"
      [label]="button.label"
      [numberOfFavorites]="button.numberOfFavorites"
      [disabled]="button.disabled"
      [disabledReason]="button.disabledReason"
      [disabledReasonParams]="button.disabledReasonParams"
      [shouldTranslate]="shouldTranslate()"
      [fullWidth]="button.fullWidth ?? false"
      (click)="button.onClick()"
    />
  }
</div>
