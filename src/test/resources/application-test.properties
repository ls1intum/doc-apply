# Every Spring test context gets its own database in a PostgreSQL container, started by the Testcontainers JDBC driver
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///docapply_${random.value}?TC_TMPFS=/var/lib/postgresql:rw
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.liquibase.change-log=classpath:config/liquibase/master.xml
spring.liquibase.contexts=

spring.jpa.properties.hibernate.globally_quoted_identifiers=false

aet.storage.root=/tmp/test-storage
aet.data-export.root=/tmp/test-exports
