name: docapply
services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: always
    networks:
      - shared-network
    volumes:
      - ./postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
  docapply:
    image: "ghcr.io/ls1intum/doc-apply:${IMAGE_TAG}"
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - ./docs_data:/data/docs
      - ./images_data:/data/images
    healthcheck:
      test: wget -nv -t1 --spider http://localhost:8080/actuator/health || exit 1
      start_period: 100s
      interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - shared-network
  nginx:
    image: nginx:1.29.6-alpine-slim
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
      - "443"
    healthcheck:
      test: service nginx status || exit 1
      start_period: 10s
    restart: always
    depends_on:
      docapply:
        condition: service_healthy
    volumes:
      - ./src/main/resources/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/main/resources/config/nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./src/main/webapp/content/images/docapply-logo/docapply-logo.svg:/usr/share/nginx/html/docapply-logo.svg:ro
      - type: bind
        source: "/var/lib/rbg-cert/live/fullchain.pem"
        target: "/certs/fullchain.pem"
      - type: bind
        source: "/var/lib/rbg-cert/live/privkey.pem"
        target: "/certs/privkey.pem"
    networks:
      - shared-network

networks:
  shared-network:
    name: docapply-shared-network
    driver: bridge
